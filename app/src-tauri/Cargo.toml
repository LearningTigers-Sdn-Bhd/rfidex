[package]
name = "rfidex-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rfidex"
path = "src/main.rs"

[lib]
name = "rfidex_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfidex-core = { path = "../../crates/rfidex-core" }
rfidex-hardware = { path = "../../crates/rfidex-hardware" }
rfidex-runtime = { path = "../../crates/rfidex-runtime" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tauri-plugin-updater = "2"
