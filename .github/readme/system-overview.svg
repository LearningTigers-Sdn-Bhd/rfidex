<text x="52" y="109" fill="#eff6ff" font-size="34" font-weight="700">One runtime. Independent stations.</text>
<text x="1387" y="62" fill="#b5c6d8" text-anchor="end" font-size="17">DESKTOP / WINDOWS x64</text>
<g fill="#10273a" stroke="#35516b" stroke-width="2"><rect x="52" y="151" width="378" height="146" rx="10"/><rect x="531" y="151" width="378" height="146" rx="10"/><rect x="1010" y="151" width="378" height="146" rx="10"/></g>
