name: windows-package

# Deliberately separate from ci.yml. A full 500-ticket rehearsal and an NSIS
# installer are far too heavy for every push, so this runs only when dispatched
# by hand or when a version tag is pushed. Normal CI is untouched.
on:
  workflow_dispatch:
  push:
    tags: ["rfidex-v*"]

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      # Tauri's release path links the static VC runtime, so the installer must
      # not need a redistributable. The import audit below is what proves it.
      STATIC_VCRUNTIME: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Prepare evidence folders
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path evidence, test-tools | Out-Null

      # A tag is a claim about a version. If it disagrees with the manifests,
      # fail the gate instead of editing files to make it agree.
      - name: Tag must match the declared versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:GITHUB_REF_NAME -replace '^rfidex-v', ''
          $tauri = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ($expected -ne $tauri) {
            throw "tag $env:GITHUB_REF_NAME does not match tauri.conf.json version $tauri"
          }
          if ($expected -ne $cargo) {
            throw "tag $env:GITHUB_REF_NAME does not match workspace version $cargo"
          }
          "tag $($env:GITHUB_REF_NAME) matches version $expected" |
            Tee-Object -FilePath evidence/tag-check.txt

      - name: Full headless rehearsal
        shell: pwsh
        run: |
          cargo test --locked -p rfidex-runtime --test rehearsal -- --include-ignored --nocapture 2>&1 |
            Tee-Object -FilePath evidence/rehearsal.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Record tool versions and revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE/evidence/tool-versions.txt"
          rustc -Vv | Out-File -Encoding utf8 $out
          cargo -V | Out-File -Encoding utf8 -Append $out
          "node $(node --version)" | Out-File -Encoding utf8 -Append $out
          "npm $(npm --version)" | Out-File -Encoding utf8 -Append $out
          "GITHUB_SHA=$env:GITHUB_SHA" | Out-File -Encoding utf8 -Append $out
          "GITHUB_RUN_ID=$env:GITHUB_RUN_ID" | Out-File -Encoding utf8 -Append $out
          "GITHUB_REF=$env:GITHUB_REF" | Out-File -Encoding utf8 -Append $out
          Push-Location app
          $tauri = (npx --no-install tauri --version) -join ' '
          Pop-Location
          "tauri-cli $tauri" | Out-File -Encoding utf8 -Append $out
          Get-Content $out

      # beforeBuildCommand runs `npm run build`, so the frontend is not built
      # twice. Output is the explicit target directory, not target/release.
      - name: Build NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis -- --locked
        working-directory: app

      # A test tool for the manual Windows check, NOT part of the installer.
      # Static CRT so it cannot add a runtime prerequisite to a clean machine.
      - name: Build static mock server (test tool)
        run: cargo build --locked --release -p rfidex-mock --target x86_64-pc-windows-msvc
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Audit native imports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'no Visual Studio installation with x64 VC tools found' }
          # ...\VC\Tools\MSVC\<version>\bin\Hostx64\x64\dumpbin.exe: the version
          # directory is three levels above the file's own directory.
          $candidates = @(Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe'))
          if ($candidates.Count -eq 0) { throw 'dumpbin.exe not found' }
          $dumpbin = $candidates |
            Sort-Object { [version]$_.Directory.Parent.Parent.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not (Test-Path $dumpbin.FullName)) { throw "dumpbin.exe not usable: $($dumpbin.FullName)" }

          $root = (Resolve-Path 'target/x86_64-pc-windows-msvc/release').Path
          if (-not (Test-Path "$root/rfidex.exe")) { throw 'missing rfidex.exe' }
          if (-not (Test-Path "$root/rfidex-mock.exe")) { throw 'missing rfidex-mock.exe' }
          $targets = @(
            (Resolve-Path "$root/rfidex.exe").Path
            (Resolve-Path "$root/rfidex-mock.exe").Path
          )
          # Anything the bundler ships beside the app, wherever it staged it.
          foreach ($dir in @($root, "$root/bundle/nsis", "$root/nsis")) {
            $targets += Get-ChildItem $dir -Filter *.dll -Recurse -File -ErrorAction SilentlyContinue |
              ForEach-Object FullName
          }
          $targets = @($targets | Sort-Object -Unique)

          # msvcrt.dll and ucrtbase.dll are OS components, not a reason to ship
          # a redistributable. Everything redistributable fails the gate.
          $banned = '^(VCRUNTIME[^\\/]*\.dll|MSVCP[^\\/]*\.dll|CONCRT[^\\/]*\.dll|MSVCR[0-9][^\\/]*\.dll)$'
          $report = @("dumpbin: $($dumpbin.FullName)", '')
          $bad = @()
          foreach ($file in $targets) {
            $lines = & $dumpbin.FullName /nologo /DEPENDENTS $file
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $file" }
            $imports = @($lines | ForEach-Object {
              if ($_ -match '^\s+([A-Za-z0-9_.\-]+\.dll)\s*$') { $Matches[1] }
            } | Sort-Object -Unique)
            # Report where the file was found: the same DLL is staged beside the
            # app and inside the bundler's staging folders.
            $report += "== $([System.IO.Path]::GetRelativePath($root, $file))"
            $report += @($imports | ForEach-Object { "   $_" })
            foreach ($dll in $imports) {
              if ($dll -imatch $banned) {
                $bad += "$([System.IO.Path]::GetRelativePath($root, $file)) imports $dll"
              }
            }
          }
          $report += ''
          $report += "audited $($targets.Count) file(s)"
          $report | Set-Content evidence/native-imports.txt
          Get-Content evidence/native-imports.txt

          if ($bad.Count -gt 0) { throw "VC++ redistributable imports found: $($bad -join '; ')" }
          "No VC++ redistributable imports: the installer needs no vcredist step." |
            Add-Content evidence/native-imports.txt

      - name: Manifest, hashes and signing status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$root/bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 1) {
            throw "expected exactly one NSIS installer, found $($installers.Count)"
          }
          if (-not (Test-Path "$root/rfidex.exe")) { throw 'missing rfidex.exe' }

          $setup = $installers[0]
          $hash = Get-FileHash $setup.FullName -Algorithm SHA256
          "$($hash.Hash)  $($setup.Name)" | Set-Content "$root/bundle/nsis/SHA256SUMS.txt"

          $mockHash = Get-FileHash "$root/rfidex-mock.exe" -Algorithm SHA256
          $signature = Get-AuthenticodeSignature $setup.FullName
          $label = if ($signature.Status -eq 'NotSigned') {
            'UNSIGNED: controlled-test artifact, not for distribution'
          } else {
            "signature status $($signature.Status)"
          }
          @(
            "installer: $($setup.Name)"
            "installer sha256: $($hash.Hash)"
            "test tool: rfidex-mock.exe sha256: $($mockHash.Hash)"
            "signing: $($signature.Status) - $($signature.StatusMessage)"
            "label: $label"
          ) | Set-Content evidence/installer.txt
          Get-Content evidence/installer.txt

      # Uploaded only after the rehearsal, the build and the import gate passed.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfidex-windows-x64-unsigned-${{ github.sha }}-${{ github.run_id }}
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
            evidence/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload test tools (not part of the installer)
        shell: pwsh
        run: |
          @(
            'RfiDex test tools for the manual Windows check, Plan 3 Task 6.'
            'TEST ONLY: rfidex-mock.exe is a disposable loopback mock server.'
            'It is never installed, packaged, or shipped with RfiDex.'
            'Run it with a throwaway key, for example:'
            '  rfidex-mock.exe --port 4010 --api-key <32+ chars> --tickets tickets.json'
          ) | Set-Content test-tools/README.txt

      - name: Upload test tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfidex-test-tools-${{ github.sha }}-${{ github.run_id }}
          path: |
            target/x86_64-pc-windows-msvc/release/rfidex-mock.exe
            app/dev/tickets.json
            test-tools/README.txt
          if-no-files-found: error
          retention-days: 14
