<g font-size="30" fill="#eff6ff" font-weight="700"><text x="78" y="230">Check in + link</text><text x="557" y="230">Record arrivals</text><text x="1036" y="230">Record departures</text></g>
<g font-size="18" fill="#b5c6d8"><text x="78" y="270">Own UUID / API client / SQLite</text><text x="557" y="270">Own UUID / API client / SQLite</text><text x="1036" y="270">Own UUID / API client / SQLite</text></g>
