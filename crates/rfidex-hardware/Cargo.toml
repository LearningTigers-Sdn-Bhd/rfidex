[package]
name = "rfidex-hardware"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rfidex-core = { path = "../rfidex-core" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
test-host = []

[[bin]]
name = "rfidex-device-host"
path = "src/bin/rfidex-device-host.rs"

[[bin]]
name = "rfidex-fake-host"
path = "src/bin/rfidex-fake-host.rs"
required-features = ["test-host"]
