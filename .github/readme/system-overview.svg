<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="510" viewBox="0 0 1440 510" role="img" aria-labelledby="title desc">
<title id="title">RfiDex — one runtime, independent stations</title>
<desc id="desc">Desk, entry and exit stations each keep their own identity, API client and SQLite store. A shared runtime coordinates them. Rust calls a separate loopback printer app without an API key. The EventzFlow mock implements the device API during development.</desc>
